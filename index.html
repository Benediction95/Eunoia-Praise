<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reels Monitor & AI Analyzer</title>
  <!-- Tailwind CSS & Marked.js (Markdown 파서) CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    .markdown-body h3 { font-size: 1.1rem; font-weight: 700; color: #f3f4f6; margin-top: 1rem; margin-bottom: 0.5rem; }
    .markdown-body p, .markdown-body li { color: #d1d5db; line-height: 1.6; font-size: 0.95rem; }
    .markdown-body ul { list-style-type: disc; padding-left: 1.25rem; margin-bottom: 0.75rem; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans">

  <!-- 상단 네비게이션 및 검색창 -->
  <header class="border-b border-gray-800 bg-gray-900/80 backdrop-blur sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-6 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <span class="text-2xl">📊</span>
        <h1 class="text-xl font-bold tracking-tight text-white">Reels AI Monitor</h1>
      </div>
      
      <form id="analyzeForm" class="flex w-full md:w-2/3 max-w-2xl gap-2">
        <input 
          type="url" 
          id="reelsUrl" 
          required
          placeholder="인스타그램 릴스 링크 입력 (https://www.instagram.com/reel/...)" 
          class="w-full px-4 py-2.5 rounded-lg bg-gray-800 border border-gray-700 text-sm text-white placeholder-gray-400 focus:outline-none focus:border-indigo-500"
        />
        <button 
          type="submit" 
          id="submitBtn"
          class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-lg text-sm whitespace-nowrap transition cursor-pointer"
        >
          분석 및 재생
        </button>
      </form>
    </div>
  </header>

  <!-- 메인 대시보드 영역 -->
  <main class="max-w-6xl mx-auto px-6 py-8">
    
    <!-- 로딩 스피너 -->
    <div id="loadingState" class="hidden flex-col items-center justify-center py-20">
      <div class="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4"></div>
      <p class="text-gray-400 text-sm">릴스 메타데이터 추출 및 AI 전략 분석 중...</p>
    </div>

    <!-- 에러 메시지 -->
    <div id="errorState" class="hidden bg-red-950/60 border border-red-800 text-red-200 px-5 py-4 rounded-xl mb-6 text-sm"></div>

    <!-- 결과 콘텐츠 (초기 숨김) -->
    <div id="resultContainer" class="hidden grid grid-cols-1 lg:grid-cols-12 gap-8">
      
      <!-- 좌측: 비디오 플레이어 영역 (4칸) -->
      <div class="lg:col-span-5 flex flex-col items-center bg-gray-900 border border-gray-800 rounded-2xl p-5">
        <div class="w-full flex items-center justify-between mb-4">
          <span id="uploaderBadge" class="text-sm font-semibold text-indigo-400">@username</span>
          <div class="flex gap-1 bg-gray-800 p-1 rounded-lg text-xs">
            <button type="button" onclick="switchPlayer('embed')" id="btnEmbed" class="px-2.5 py-1 rounded bg-indigo-600 text-white font-medium">공식 임베드</button>
            <button type="button" onclick="switchPlayer('direct')" id="btnDirect" class="px-2.5 py-1 rounded text-gray-400 hover:text-white">MP4 직링크</button>
          </div>
        </div>

        <!-- 1) 인스타그램 공식 임베드 플레이어 (CORS 차단 없음) -->
        <div id="embedPlayerWrap" class="w-full flex justify-center overflow-hidden rounded-xl bg-black">
          <iframe id="reelsIframe" class="w-full max-w-[350px] h-[600px] border-0" allowfullscreen></iframe>
        </div>

        <!-- 2) MP4 직링크 비디오 태그 -->
        <div id="directPlayerWrap" class="hidden w-full flex justify-center overflow-hidden rounded-xl bg-black">
          <video id="reelsVideo" controls playsinline referrerpolicy="no-referrer" class="w-full max-w-[350px] max-h-[600px] rounded-xl"></video>
        </div>
      </div>

      <!-- 우측: 지표 대시보드 및 AI 분석 리포트 (8칸) -->
      <div class="lg:col-span-7 flex flex-col gap-6">
        
        <!-- 핵심 지표 카드 4개 -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
          <div class="bg-gray-900 border border-gray-800 p-4 rounded-xl">
            <p class="text-xs text-gray-400 mb-1">조회수 (Views)</p>
            <p id="metricViews" class="text-xl font-bold text-white">-</p>
          </div>
          <div class="bg-gray-900 border border-gray-800 p-4 rounded-xl">
            <p class="text-xs text-gray-400 mb-1">좋아요 (Likes)</p>
            <p id="metricLikes" class="text-xl font-bold text-pink-400">-</p>
          </div>
          <div class="bg-gray-900 border border-gray-800 p-4 rounded-xl">
            <p class="text-xs text-gray-400 mb-1">댓글 (Comments)</p>
            <p id="metricComments" class="text-xl font-bold text-blue-400">-</p>
          </div>
          <div class="bg-gray-900 border border-gray-800 p-4 rounded-xl">
            <p class="text-xs text-gray-400 mb-1">반응률 (ER)</p>
            <p id="metricER" class="text-xl font-bold text-emerald-400">-</p>
          </div>
        </div>

        <!-- AI 분석 리포트 카드 -->
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6">
          <div class="flex items-center gap-2 border-b border-gray-800 pb-3 mb-4">
            <span class="text-lg">🤖</span>
            <h2 class="text-base font-bold text-white">AI 콘텐츠 전략 분석 리포트</h2>
          </div>
          <div id="aiReportContent" class="markdown-body"></div>
        </div>

        <!-- 원본 캡션 보기 -->
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6">
          <h3 class="text-sm font-bold text-gray-300 mb-2">📝 원본 캡션 및 해시태그</h3>
          <pre id="rawCaption" class="text-xs text-gray-400 whitespace-pre-wrap font-sans leading-relaxed max-h-48 overflow-y-auto"></pre>
        </div>

      </div>
    </div>
  </main>

  <script>
    const API_BASE_URL = "http://localhost:8000"; // 백엔드 서버 주소

    const form = document.getElementById("analyzeForm");
    const loadingState = document.getElementById("loadingState");
    const errorState = document.getElementById("errorState");
    const resultContainer = document.getElementById("resultContainer");

    // 플레이어 탭 전환 함수
    function switchPlayer(mode) {
      const embedWrap = document.getElementById("embedPlayerWrap");
      const directWrap = document.getElementById("directPlayerWrap");
      const btnEmbed = document.getElementById("btnEmbed");
      const btnDirect = document.getElementById("btnDirect");
      const videoEl = document.getElementById("reelsVideo");

      if (mode === 'embed') {
        embedWrap.classList.remove("hidden");
        directWrap.classList.add("hidden");
        videoEl.pause();
        btnEmbed.className = "px-2.5 py-1 rounded bg-indigo-600 text-white font-medium";
        btnDirect.className = "px-2.5 py-1 rounded text-gray-400 hover:text-white";
      } else {
        embedWrap.classList.add("hidden");
        directWrap.classList.remove("hidden");
        btnDirect.className = "px-2.5 py-1 rounded bg-indigo-600 text-white font-medium";
        btnEmbed.className = "px-2.5 py-1 rounded text-gray-400 hover:text-white";
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const url = document.getElementById("reelsUrl").value.trim();
      if (!url) return;

      // UI 상태 초기화
      loadingState.classList.remove("hidden");
      loadingState.classList.add("flex");
      errorState.classList.add("hidden");
      resultContainer.classList.add("hidden");

      try {
        const response = await fetch(`${API_BASE_URL}/api/analyze`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url })
        });

        const result = await response.json();
        if (!response.ok) {
          throw new Error(result.detail || "데이터를 불러오는데 실패했습니다.");
        }

        const { data, ai_analysis } = result;

        // 1. 플레이어 데이터 바인딩
        document.getElementById("uploaderBadge").textContent = `@${data.uploader_id}`;
        document.getElementById("reelsIframe").src = data.embed_url;
        document.getElementById("reelsVideo").src = data.video_url;

        // 2. 핵심 지표 바인딩
        const views = data.view_count || 0;
        const likes = data.like_count || 0;
        const comments = data.comment_count || 0;
        const er = views > 0 ? ((likes / views) * 100).toFixed(2) + "%" : "집계 안됨";

        document.getElementById("metricViews").textContent = views > 0 ? views.toLocaleString() + "회" : "비공개";
        document.getElementById("metricLikes").textContent = likes > 0 ? likes.toLocaleString() + "개" : "비공개";
        document.getElementById("metricComments").textContent = comments.toLocaleString() + "개";
        document.getElementById("metricER").textContent = er;

        // 3. AI 분석 리포트(Markdown -> HTML 변환) 및 캡션 바인딩
        document.getElementById("aiReportContent").innerHTML = marked.parse(ai_analysis);
        document.getElementById("rawCaption").textContent = data.description || "캡션 내용이 없습니다.";

        // 결과 화면 표시
        resultContainer.classList.remove("hidden");
      } catch (err) {
        errorState.textContent = `오류 발생: ${err.message}`;
        errorState.classList.remove("hidden");
      } finally {
        loadingState.classList.add("hidden");
        loadingState.classList.remove("flex");
      }
    });
  </script>
</body>
</html>
